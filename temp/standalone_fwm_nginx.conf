# ==============================================================================
# FWM A Little Wonder - 獨立 Nginx 網關分流與 SSO 認證設定檔
# 適用於：Nginx 位於獨立專案或獨立容器之場景
# ==============================================================================
# 架構說明：
# 1. Cloudflare Tunnel (或外部流量) -> Nginx (監聽 80 / 443)
# 2. 根路徑 "/"               -> 00-UnifiedPortal (大廳 / Google OAuth 登入, Port 8000)
# 3. 挑戰路徑 "/challenges/"  -> 01-FansChallengeCheckinSystem (Port 8001)
# 4. 日誌路徑 "/journal/"     -> 02-AILearningJournalSystem (Port 8002)
#
# 注意：若 Nginx 容器與 Django 容器不在同一個 Docker Network，
#       請將 127.0.0.1 依實際環境替換為 host.docker.internal 或宿主機 IP。
# ==============================================================================

server {
    listen 80;
    server_name _;

    # 上傳檔案大小上限
    client_max_body_size 50M;

    # 安全性標頭 (Security Headers)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==========================================================================
    # 關鍵資安防護：強制抹除客戶端外部傳入之任何假冒身分 Header
    # ==========================================================================
    proxy_set_header REMOTE_USER "";
    proxy_set_header X-User-Email "";
    proxy_set_header X-User-Name "";
    proxy_set_header X-User-Id "";

    # ==========================================================================
    # 1. 內部認證端點 (專供 auth_request 內部鑑權，外網絕對無法直連)
    # ==========================================================================
    location = /internal_auth_verify {
        internal;
        proxy_pass http://127.0.0.1:8000/api/auth-verify/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie; # 傳遞瀏覽器 Cookie 供 00 驗證 Session
    }

    # ==========================================================================
    # 2. 00-UnifiedPortal 總入口大廳 (Port 8000)
    # ==========================================================================
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ==========================================================================
    # 3. 01-FansChallengeCheckinSystem 粉絲挑戰打卡系統 (Port 8001)
    # ==========================================================================
    location = /challenges {
        return 301 /challenges/;
    }

    location /challenges/ {
        # 1. 內部驗證攔截：未通過則回傳 401
        auth_request /internal_auth_verify;

        # 2. 接收 Portal 驗證成功後回傳的已認證使用者標頭
        auth_request_set $user_email $upstream_http_x_user_email;
        auth_request_set $user_name  $upstream_http_x_user_name;
        auth_request_set $user_id    $upstream_http_x_user_id;

        # 3. 轉發至子系統容器 (內部連線)
        proxy_pass http://127.0.0.1:8001/challenges/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 4. 安全注入真實認證身分 (供 01 自動建檔與登入)
        proxy_set_header REMOTE_USER $user_email;
        proxy_set_header X-User-Email $user_email;
        proxy_set_header X-User-Name $user_name;
        proxy_set_header X-User-Id $user_id;

        # 5. 未通過驗證時自動導向 Portal 登入頁
        error_page 401 = @error401;
    }

    # ==========================================================================
    # 4. 02-AILearningJournalSystem AI 學習日誌系統 (Port 8002)
    # ==========================================================================
    location = /journal {
        return 301 /journal/;
    }

    location /journal/ {
        # 1. 內部驗證攔截：未通過則回傳 401
        auth_request /internal_auth_verify;

        # 2. 接收 Portal 驗證成功後回傳的已認證使用者標頭
        auth_request_set $user_email $upstream_http_x_user_email;
        auth_request_set $user_name  $upstream_http_x_user_name;
        auth_request_set $user_id    $upstream_http_x_user_id;

        # 3. 轉發至子系統容器 (內部連線)
        proxy_pass http://127.0.0.1:8002/journal/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 4. 安全注入真實認證身分 (供 02 自動建檔與登入)
        proxy_set_header REMOTE_USER $user_email;
        proxy_set_header X-User-Email $user_email;
        proxy_set_header X-User-Name $user_name;
        proxy_set_header X-User-Id $user_id;

        # 5. 未通過驗證時自動導向 Portal 登入頁
        error_page 401 = @error401;
    }

    # ==========================================================================
    # 5. 未登入處理 (401 Unauthorized 自動導向 00 總大廳 Google 登入頁)
    # ==========================================================================
    location @error401 {
        return 302 /accounts/login/?next=$request_uri;
    }
}
